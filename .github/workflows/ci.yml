name: CI

on:
  pull_request:

jobs:
  build:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install pandoc on Linux (pinned for Markdown lint/format)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
          sudo dpkg -i pandoc-3.10.2-1-amd64.deb
          pandoc --version | head -1

      - name: Install pandoc on Windows (pinned for Markdown lint/format)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\pandoc.zip"
          $dir = "$env:RUNNER_TEMP\pandoc-3.10.2"
          Invoke-WebRequest -Uri https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-windows-x86_64.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP"
          Add-Content $env:GITHUB_PATH $dir
          & "$dir\pandoc.exe" --version | Select-Object -First 1

      - name: Lint
        run: pnpm lint

  # Test shards run in parallel with the build+lint matrix instead of
  # waiting on it: they install and build their own assets, and a broken
  # build still fails the PR through its own job. Tests run on Linux and
  # Windows: Windows-only regressions (#204, #207) previously escaped CI
  # because the suite only ever ran on Linux — the win32 suite exclusion
  # in vitest.config.ts never even executed there.
  test:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build:assets

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6.1.0
        with:
          # One path per OS; only the matching one exists on each runner,
          # and actions/cache ignores the absent ones.
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      # Saving happens inline (browsers are final the moment the install
      # step succeeds) and only from one shard per OS: the composite
      # action's post-job save made all four shards race to reserve the
      # same key, each taring ~400MB for half a minute before three of
      # them lost — post-job time the slowest shard cannot afford inside
      # the 10-minute job budget.
      - name: Save Playwright browsers
        if: matrix.shard == '4/4'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Test (${{ matrix.os }}, shard ${{ matrix.shard }})
        run: pnpm exec vitest run --shard ${{ matrix.shard }}
