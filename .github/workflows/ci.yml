name: CI

on:
  pull_request:
    # Prose-only changes can't fail the build — don't boot five jobs
    # for them. (pr-shots/ is gitignored today; this keeps the skip
    # correct if shots ever get tracked.)
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "pr-shots/**"

# A new push to an open PR used to stack a full 5-job run on top of
# the previous one (Sep 25 alone burned ~500 runner-minutes this way).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install pandoc (pinned for Markdown lint/format)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i pandoc-3.12.1-1-amd64.deb
          pandoc --version | head -1

      - name: Lint
        run: pnpm lint

  # Test shards run in parallel with the build+lint job instead of
  # waiting on it: they install and build their own assets, and a broken
  # build still fails the PR through its own job. Ubuntu only: with
  # Windows out of CI, the win32 suite exclusion in vitest.config.ts
  # never runs, so Windows-only regressions (#204, #207 were caught
  # this way) can slip through again.
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build:assets

      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      # Saved inline (browsers are final once install succeeds) and from
      # one shard only: the cache action's post-job save made all four
      # shards race for the same key and burned post-job time the
      # 10-minute job budget cannot afford.
      - name: Save Playwright browsers
        if: matrix.shard == '4/4'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Test (shard ${{ matrix.shard }})
        run: pnpm exec vitest run --shard ${{ matrix.shard }}
