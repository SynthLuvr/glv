allowBuilds:
  "@ast-grep/cli": true
  "@parcel/watcher": true
  esbuild: true
permissions:
  # arktype ships pnpm "agent skills" (permission added in pnpm 12.11).
  # Denied so installs never link dependency-provided skill files into
  # the repo; flipping to true is a deliberate maintainer decision.
  arktype:
    skills: false
# Keep scriptShell unset — forcing bash made Windows pick WSL's
# bash.exe (which has no node), so lifecycle scripts died with exit
# 127; pnpm's per-platform default handles every script fine.
