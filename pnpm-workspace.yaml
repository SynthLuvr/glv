allowBuilds:
  '@ast-grep/cli': true
  '@parcel/watcher': true
  esbuild: true
minimumReleaseAgeExclude:
  - ts-canon@0.2.0
  - type-a-bin@0.1.7
  - cronstrue@3.25.0
  - jscpd-darwin-arm64@5.2.0
  - jscpd-darwin-x64@5.2.0
  - jscpd-linux-arm64-gnu@5.2.0
  - jscpd-linux-arm64-musl@5.2.0
  - jscpd-linux-x64-gnu@5.2.0
  - jscpd-linux-x64-musl@5.2.0
  - jscpd-windows-arm64-msvc@5.2.0
  - jscpd-windows-x64-msvc@5.2.0
  - jscpd@5.2.0
  - tsx@4.23.15
# scriptShell is intentionally unset — pnpm's per-platform default
# (cmd.exe on Windows, /bin/sh on POSIX) runs every script in
# package.json. Forcing bash made Windows installs resolve the first
# bash.exe on PATH, which is often WSL's launcher: it has no node, so
# every lifecycle script (e.g. @ast-grep/cli's postinstall) exited 127.
